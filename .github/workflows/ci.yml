name: CI

on:
  push:
    branches-ignore: [main]

jobs:
  test:
    name: Pusher tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Test the GitHub pusher
        env:
          ACTOR: ${{ github.actor }}
        run: |
          MEMBER="${ACTOR//-/_}"

          if [ ! -d "members/$MEMBER" ]; then
            echo "No member folder found: members/$MEMBER"
            exit 1
          fi

          case "$MEMBER" in
            khanh47)  VARIANT=1 ;;
            nghiale29_coder) VARIANT=2 ;;
            Slampanda)    VARIANT=3 ;;
            conmefo)   VARIANT=4 ;;
            *)
              VARIANT=""
              ;;
          esac

          python -m ruff check "members/$MEMBER"

          if [ -n "$VARIANT" ]; then
            python -m pytest -q tests/test_w1.py::test_w1_4_translate \
              --member "$MEMBER" \
              --variant "$VARIANT"
          else
            echo "$MEMBER is not assigned W1-4; skipping its test"
          fi

          ! git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- "members/$MEMBER"
