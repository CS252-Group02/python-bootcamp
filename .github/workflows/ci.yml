name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: PR author tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Resolve the PR author's member folder
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # The actor can be a reviewer; homework belongs to the PR author.
          MEMBER="${PR_AUTHOR//-/_}"

          if [ ! -d "members/$MEMBER" ]; then
            echo "No member folder found: members/$MEMBER"
            exit 1
          fi

          echo "MEMBER=$MEMBER" >> "$GITHUB_ENV"

      - name: Lint and check conflict markers
        run: |
          python -m ruff check "members/$MEMBER"
          ! git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- "members/$MEMBER"

      - name: Test week 1 translation assignment
        run: |
          case "$MEMBER" in
            khanh47)  VARIANT=1 ;;
            nghiale29_coder) VARIANT=2 ;;
            Slampanda)    VARIANT=3 ;;
            conmefo)   VARIANT=4 ;;
            *)
              VARIANT=""
              ;;
          esac

          if [ -n "$VARIANT" ]; then
            python -m pytest -q tests/test_w1.py::test_w1_4_translate \
              --member "$MEMBER" \
              --variant "$VARIANT"
          else
            echo "$MEMBER is not assigned W1-4; skipping its test"
          fi

      - name: Test week 2 homework
        run: python -m pytest -q tests/test_w2.py --member "$MEMBER"
