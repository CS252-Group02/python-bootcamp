name: CI

on:
  push:
    branches-ignore: [main]

jobs:
  test:
    name: Pusher tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Test the GitHub pusher
        env:
          ACTOR: ${{ github.actor }}
        run: |
          MEMBER="${ACTOR//-/_}"

          if [ ! -d "members/$MEMBER" ]; then
            echo "No member folder found: members/$MEMBER"
            exit 1
          fi

          python -m ruff check "members/$MEMBER"
          python -m pytest -q tests/test_w1.py \
            --member "$MEMBER" \
            --variant 1

          ! git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- "members/$MEMBER"