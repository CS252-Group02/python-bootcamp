
name: CI

on:
  push:
    branches-ignore: [main]

jobs:
  test:
    name: Pusher tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Test the GitHub pusher
        env:
          ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          MEMBER="${ACTOR//-/_}"

          if [ ! -d "members/$MEMBER" ]; then
            echo "No member folder found: members/$MEMBER"
            exit 1
          fi

          case "$MEMBER" in
            khanh47)  VARIANT=1 ;;
            nghiale29_coder) VARIANT=2 ;;
            Slampanda)    VARIANT=3 ;;
            conmefo)   VARIANT=4 ;;
            *)
              echo "No W1-4 variant assigned to $MEMBER"
              exit 1
              ;;
          esac

          # Check code quality
          python -m ruff check "members/$MEMBER"

          # Run shared exercises (W1-1, W1-2, W1-3)
          python -m pytest -q tests/test_w1.py \
            -k "not test_w1_4_translate" \
            --member "$MEMBER"

          # Run W1-4 with the assigned variant
          python -m pytest -q \
            tests/test_w1.py::test_w1_4_translate \
            --member "$MEMBER" \
            --variant "$VARIANT"

          # Check for merge conflict markers
          ! git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- "members/$MEMBER"
