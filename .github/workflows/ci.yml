name: CI

on:
  push:
    branches-ignore: [main]

jobs:
  test:
    name: Pusher tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Test the GitHub pusher
        env:
          ACTOR: ${{ github.actor }}
        run: |
          MEMBER="${ACTOR//-/_}"

          if [ ! -d "members/$MEMBER" ]; then
            echo "No member folder found: members/$MEMBER"
            exit 1
          fi

          case "$MEMBER" in
            khanh_ph)  VARIANT=1 ;;
            nghia_ltd) VARIANT=2 ;;
            lam_ns)    VARIANT=3 ;;
            minh_hq)   VARIANT=4 ;;
            *)
              echo "No W1-4 variant assigned to $MEMBER"
              exit 1
              ;;
          esac

          python -m ruff check "members/$MEMBER"
          python -m pytest -q tests/test_w1.py::test_w1_4_translate \
            --member "$MEMBER" \
            --variant "$VARIANT"

          ! git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- "members/$MEMBER"